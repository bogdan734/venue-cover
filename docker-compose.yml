services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: venue
      POSTGRES_DB: venue
    ports:
      - "54329:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venue"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dbdata:
