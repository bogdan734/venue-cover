name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U venue -d venue"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://venue:venue@localhost:54329/venue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/check
